<!-- Марка English Tutor: sage-квадрат и кремовое «En» курсивом — та же
     форма, что у LogoBox в интерфейсе. Раньше здесь был фиолетовый знак от
     старого дизайна, не совпадавший ни с приложением, ни с theme-color. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="English Tutor">
  <rect width="64" height="64" rx="14" ry="14" fill="#5C7050"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" ry="13.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif"
        font-size="34" font-weight="600" font-style="italic" fill="#FAF5E8">En</text>
</svg>
