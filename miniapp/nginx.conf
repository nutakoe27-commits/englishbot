server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-сжатие статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA fallback — все маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # КРИТИЧНО: index.html НЕ должен кешироваться. Иначе после нового билда
    # Telegram/браузер продолжают грузить старую страницу со ссылкой на
    # уже не существующий /assets/index-OLDHASH.js → юзер видит старую версию
    # mini app, фичи "не работают". /assets/* кешируются на год, потому что
    # Vite добавляет content-hash к именам.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Кэширование статических ассетов (Vite добавляет хеш к именам файлов).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker НЕ кешируем по той же причине, что и index.html: браузер
    # проверяет /sw.js при каждой загрузке, и закешированный worker остаётся
    # старым навсегда — вместе со своей логикой пушей и офлайна.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # Манифест меняется редко, но кешировать его надолго незачем: от него
    # зависят иконка и имя уже установленного приложения.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # Digital Asset Links — по нему Android проверяет, что приложение из
    # магазина принадлежит этому домену. Без явного location SPA-fallback
    # отдал бы вместо JSON страницу index.html, и проверка бы не прошла.
    # try_files с =404 нужен ровно за этим: честная 404, а не HTML.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
