# Admin Panel STAGING — admin-english-test.krichigindocs.ru → контейнер admin
# тестового стенда (порт 8085 на 127.0.0.1).
#
# Ставится на VPS в /etc/nginx/sites-available/ + симлинк в sites-enabled/.
# Сертификат: тот же wildcard-набор Let's Encrypt, что и у остальных
# поддоменов — домен нужно добавить в сертификат (см. инструкцию в README
# или certbot --expand, перечислив все домены).
server {
    listen 80;
    listen [::]:80;
    server_name admin-english-test.krichigindocs.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin-english-test.krichigindocs.ru;

    ssl_certificate /etc/letsencrypt/live/englishbot.krichigindocs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englishbot.krichigindocs.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Та же защита, что и на боевой админке.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Тестовый стенд не должен попадать в поиск.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
